<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escritório</title>
<link rel="stylesheet" href="/css/escritorio.css">
<script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three/addons/" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="baloes"></div>

<header id="topo">
  <div id="conexao" class="vidro"><span id="dot" class="dot"></span><span id="conn">conectando&hellip;</span><span id="proj"></span></div>
  <div id="chips" class="vidro">
    <span class="chip" title="Tempo do trabalho atual">&#9201; <b id="cTime">00:00</b></span>
    <span class="chip" title="Arquivos editados neste projeto">&#128221; <b id="cFiles">0</b></span>
    <span class="chip" title="Subagentes trabalhando agora">&#129302; <b id="cSub">0</b></span>
    <span class="chip" title="Custo neste projeto">&#128176; <b id="cCost">$0.00</b></span>
    <span class="chip" id="cModelWrap" hidden>&#129504; <b id="cModel"></b></span>
  </div>
  <button id="bMenu" class="vidro" title="Menu" aria-expanded="false" aria-controls="botoes">&#9776;</button>
  <div id="botoes" class="vidro">
    <button id="bCam" data-rot="C&acirc;mera" title="C&acirc;mera: livre, seguir quem trabalha ou cinema">&#127909; <span>seguir</span></button>
    <button id="bLook" data-rot="Apar&ecirc;ncia" title="Apar&ecirc;ncia: temas do escrit&oacute;rio e skins dos personagens">&#127912;</button>
    <button id="bQual" data-rot="Qualidade" title="Qualidade gr&aacute;fica">&#9881; <span>alta</span></button>
    <button id="bDemo" data-rot="Demonstra&ccedil;&atilde;o" title="Ver todas as anima&ccedil;&otilde;es">&#9654;</button>
    <button id="bFora" data-rot="Modo fora" title="Modo fora: avisa no celular e espera a sua resposta pelo painel" hidden>&#128694; <span>fora</span></button>
    <button id="bSound" data-rot="Som e avisos" title="Ativar som e avisos do Windows">&#128276;</button>
    <button id="bPin" data-rot="Sempre por cima" title="Manter a janela sempre por cima das outras" hidden>&#128204;</button>
    <button id="bHide" data-rot="Ocultar janela" title="Ocultar a janela (ela volta no seu pr&oacute;ximo pedido ao agente)" hidden>&#10515;</button>
  </div>
</header>

<section id="painel" class="vidro">
  <div class="ctx" id="ctx" title="Clique para ajustar o limite de contexto do modelo">
    <div class="ctxh"><span>Contexto</span><b id="ctxTxt">0 / 200K (0%)</b><button id="bMin" title="Minimizar o painel">&#8211;</button></div>
    <div class="bar" id="ctxBar"><i id="ctxFill"></i></div>
  </div>
  <div id="pedidosBox" class="bloco" hidden><h5>&#9995; Pedindo permiss&atilde;o</h5><ul id="pedidosList"></ul></div>
  <div id="corpo">
    <div id="subsBox" class="bloco" hidden><h5>&#129302; Subagentes</h5><ul id="subsList"></ul></div>
    <div id="skillsBox" class="bloco" hidden><h5>&#10024; Skills</h5><div id="skillsList"></div></div>
    <ul id="log"></ul>
  </div>
</section>

<section id="detalhe" class="vidro" hidden></section>
<section id="aparencia" class="vidro" hidden></section>

<script type="module" src="/js/main.js"></script>
</body>
</html>
