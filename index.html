<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escrit&oacute;rio</title>
<style>
  :root{
    --bg:#14161c; --card:#1b1e27; --ink:#e8e8ee; --mut:#8a8fa0; --line:#2b2f3a;
    --desk:#6b4a2f; --desk2:#4e3521; --skin:#f2c9a0;
    --plan:#ffb454; --build:#5aa9ff; --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;color:var(--mut);font-size:12px}
  .conn{display:flex;align-items:center;gap:6px;min-width:0}
  .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--err)}
  .dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}
  #conn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #proj{color:var(--ink);font-weight:600}
  .hb{display:flex;gap:4px;flex:none}
  button{background:#232733;color:var(--ink);border:1px solid #2f3442;border-radius:8px;padding:3px 7px;font-size:11px;cursor:pointer}
  button:hover{border-color:var(--mut)}
  button.on{border-color:var(--ok);color:var(--ok)}

  .office{flex:0 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px;min-height:0}
  .agent{position:relative;overflow:hidden;background:var(--card);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;min-height:0;border:1px solid transparent;transition:border-color .3s,box-shadow .3s;cursor:pointer}
  .agent[data-who=plan]{--c:var(--plan)}
  .agent[data-who=build]{--c:var(--build)}
  .agent[data-status=working]{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
  .agent[data-status=waiting]{border-color:var(--warn);animation:alert 1s ease-in-out infinite}
  .agent[data-status=error]{border-color:var(--err)}
  .agent[data-status=done]{border-color:var(--ok)}
  @keyframes alert{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.0)}50%{box-shadow:0 0 14px 2px rgba(251,191,36,.55)}}

  .bubble{background:#0d0f14;border:1px solid var(--c);border-radius:10px;padding:4px 10px;font-size:12px;min-height:26px;width:100%;text-align:center;transition:opacity .3s;display:flex;align-items:center;justify-content:center}
  .bt{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .agent[data-status=idle] .bubble{opacity:.55;border-color:var(--line);color:var(--mut)}
  .agent[data-status=waiting] .bubble{border-color:var(--warn);color:var(--warn)}
  .agent[data-status=waiting] .bubble::before{content:"\270B\00a0"}
  .agent[data-status=error] .bubble{border-color:var(--err);color:var(--err)}
  .agent[data-status=error] .bubble::before{content:"\26A0\00a0"}
  .agent[data-status=done] .bubble{border-color:var(--ok);color:var(--ok)}
  .agent[data-status=done] .bubble::before{content:"\2714\00a0"}
  .label{margin-top:4px;font-weight:600;color:var(--c);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .label small{color:var(--mut);font-weight:400;text-transform:none;letter-spacing:0}
  svg{width:100%;max-height:100%;flex:1;min-height:0}

  /* ---- cena ---- */
  .sky{fill:#6cb6ff}.sun{fill:#ffd54a}.stars{opacity:0;fill:#fff}
  body[data-tod=night] .sky{fill:#10163a}
  body[data-tod=night] .sun{fill:#e8e8ee}
  body[data-tod=night] .stars{opacity:1}
  .steam path{fill:none;stroke:#cfd3dd;stroke-width:1.5;stroke-linecap:round;opacity:0;animation:steam 2.6s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:.9s}
  @keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-8px)}}

  /* ---- personagem ---- */
  .head{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s}
  .agent[data-status=idle] .head{transform:rotate(14deg) translateY(2px)}
  .arm{transform-box:fill-box;transform-origin:50% 0}
  .agent[data-status=working] .armL{animation:type .32s ease-in-out infinite alternate}
  .agent[data-status=working] .armR{animation:type .32s ease-in-out .16s infinite alternate}
  @keyframes type{from{transform:translateY(0)}to{transform:translateY(6px)}}
  .agent[data-status=working] .body{animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  /* olhos: fechados dormindo, piscando acordado */
  .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
  .agent[data-status=idle] .eye{transform:scaleY(.15);animation:none}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  /* bocas */
  .mouth{display:none}
  .m-n{display:block}
  .agent[data-status=done] .m-n,.agent[data-status=error] .m-n{display:none}
  .agent[data-status=done] .m-h{display:block}
  .agent[data-status=error] .m-o{display:block}
  /* bracos levantados */
  .up{display:none}
  .upr{transform-box:fill-box;transform-origin:50% 0}
  .agent[data-status=waiting] .up.r{display:block}
  .agent[data-status=waiting] .up.r .upr{animation:wave .5s ease-in-out infinite alternate}
  .agent[data-status=done] .up{display:block}
  .agent[data-status=done] .up .upr{animation:wave .35s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  .agent[data-status=waiting] .armL,.agent[data-status=waiting] .armR,
  .agent[data-status=done] .armL,.agent[data-status=done] .armR{display:none}
  .agent[data-status=done] .body{animation:jump .5s ease-in-out infinite}
  @keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .agent[data-status=error] .head{animation:shake .35s linear infinite;transform:none}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

  /* tela */
  .screen{fill:#0d0f14;stroke:#2b2f3a;stroke-width:2}
  .ln{fill:var(--c);opacity:.12;transform-box:fill-box;transform-origin:0 50%}
  .agent[data-status=working] .ln{animation:code 1.1s ease-in-out infinite}
  .agent[data-status=working] .ln:nth-child(2){animation-delay:.15s}
  .agent[data-status=working] .ln:nth-child(3){animation-delay:.3s}
  .agent[data-status=working] .ln:nth-child(4){animation-delay:.45s}
  .agent[data-status=working] .ln:nth-child(5){animation-delay:.6s}
  @keyframes code{0%{opacity:.15;transform:scaleX(.3)}50%{opacity:.95;transform:scaleX(1)}100%{opacity:.15;transform:scaleX(.5)}}
  .agent[data-status=waiting] .ln,.agent[data-status=done] .ln{opacity:.6}
  .term,.bsod{display:none}
  .agent[data-status=working][data-kind=bash] .code{display:none}
  .agent[data-status=working][data-kind=bash] .term{display:block}
  .tl{fill:var(--ok);opacity:0;animation:tline 1.4s steps(1) infinite}
  .tl:nth-child(2){animation-delay:.3s}.tl:nth-child(3){animation-delay:.6s}.tl:nth-child(4){animation-delay:.9s}
  @keyframes tline{0%{opacity:0}20%,100%{opacity:.9}}
  .cur{fill:var(--ok);animation:cur .8s steps(1) infinite}
  @keyframes cur{50%{opacity:0}}
  .agent[data-status=error] .code{display:none}
  .agent[data-status=error] .bsod{display:block}

  /* props por ferramenta */
  .prop{display:none}
  .agent[data-status=working][data-kind=search] .p-search,
  .agent[data-status=working][data-kind=read] .p-read,
  .agent[data-status=working][data-kind=web] .p-web{display:block}
  .swing{transform-box:fill-box;transform-origin:50% 100%;animation:swing 1s ease-in-out infinite alternate}
  @keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  .page{transform-box:fill-box;transform-origin:0 50%;animation:flip 1.2s ease-in-out infinite}
  @keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(-.9)}100%{transform:scaleX(1)}}
  .mer{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.6s linear infinite}
  @keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
  /* pensando, aviso, erro */
  .think,.badge,.sweat,.smoke{display:none}
  .agent[data-status=working][data-kind=think] .think{display:block}
  .think circle{animation:dots 1.2s infinite;opacity:.2;fill:var(--mut)}
  .think circle:nth-child(2){animation-delay:.25s}.think circle:nth-child(3){animation-delay:.5s}
  @keyframes dots{0%,100%{opacity:.2}50%{opacity:1}}
  .agent[data-status=waiting] .badge{display:block;animation:pop .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
  @keyframes pop{from{transform:scale(.9)}to{transform:scale(1.15)}}
  .agent[data-status=error] .sweat,.agent[data-status=error] .smoke{display:block}
  .smoke circle{fill:#6b7080;opacity:0;animation:smoke 1.8s ease-out infinite}
  .smoke circle:nth-child(2){animation-delay:.6s}.smoke circle:nth-child(3){animation-delay:1.2s}
  @keyframes smoke{0%{opacity:.7;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-22px) scale(1.5)}}
  /* zzz */
  .zzz{font:700 14px system-ui;fill:var(--mut);opacity:0}
  .agent[data-status=idle] .zzz{opacity:1;animation:float 2.4s ease-in-out infinite}
  .agent[data-status=idle] .zzz:nth-of-type(2){animation-delay:.6s}
  @keyframes float{0%{transform:translateY(4px);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
  .glass{fill:none;stroke:#e8e8ee;stroke-width:1.6}

  /* confete */
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-10px;width:6px;height:10px;border-radius:2px;animation:fall 1.9s ease-in forwards}
  @keyframes fall{to{transform:translateY(260px) rotate(540deg);opacity:.2}}

  /* painel */
  #panel{flex:0 0 auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
  body.compact #panel{display:none}
  .box{background:var(--card);border-radius:12px;padding:8px 10px}
  .ctx{display:flex;flex-direction:column;gap:5px;cursor:pointer}
  .ctxh{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
  .ctxh b{color:var(--ink);font-weight:600}
  .bar{height:8px;border-radius:5px;background:#0d0f14;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s,background .5s}
  .bar.mid i{background:var(--warn)} .bar.hot i{background:var(--err);animation:alert 1s infinite}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#0d0f14;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  #log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
  #log li{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
  #log li span{overflow:hidden;text-overflow:ellipsis}
  #log time{flex:none;font-variant-numeric:tabular-nums;opacity:.7}
  #log i{flex:none;width:7px;height:7px;border-radius:50%}
  #log li:first-child{color:var(--ink)}
</style>

<header>
  <span class="conn"><span id="dot" class="dot"></span><span id="conn">conectando&hellip;</span><span id="proj"></span></span>
  <span class="hb">
    <button id="bSound" title="Ativar som e avisos do Windows">&#128276; avisos</button>
    <button id="bDemo" title="Ver todas as anima&ccedil;&otilde;es">&#9654; demo</button>
    <button id="bCompact" title="Esconder ou mostrar o painel">&#9645;</button>
  </span>
</header>
<main class="office" id="office"></main>
<script src="/three.min.js"></script>
<div id="stage3d"></div>
<script>
  /* ============ modo 3D (em construção): convive com o visual 2D ============ */
  (() => {
    const css = document.createElement('style');
    css.textContent = `
  #stage3d{display:none;flex:1;min-height:0;margin:0 8px 8px;border-radius:12px;overflow:hidden;background:#0d0f14}
  body.v3d #stage3d{display:block}
  body.v3d .office{display:none}
  #stage3d canvas{display:block;width:100%;height:100%}
  body.v3d #panel{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(13,15,20,.88) 35%);pointer-events:none}
  body.v3d #panel .box{pointer-events:auto}`;
document.head.appendChild(css);

    const btn = document.createElement('button');
    btn.id = 'b3d'; btn.textContent = '3D'; btn.title = 'Alternar entre 2D e 3D';
    document.querySelector('.hb').prepend(btn);
    const set3d = on => { document.body.classList.toggle('v3d', on); btn.classList.toggle('on', on); try { localStorage.setItem('office.v3d', on ? '1' : '0'); } catch {} };
    btn.addEventListener('click', () => set3d(!document.body.classList.contains('v3d')));
    try { if (localStorage.getItem('office.v3d') === '1') set3d(true); } catch {}
  })();
</script>

<script>
  /* ============ sala 3D ============ */
  (() => {
    const host = document.getElementById('stage3d');
    const O3 = window.O3 = { tickers: [], ready: false, subs: [] }; // subs: preenchido pela conexao /events da pagina
    let renderer, scene, camera, clock, running = false, failed = false;
    const T = { x: 0, y: 1.1, z: 0 };
    const DEF = { az: 0.55, el: 0.42, r: 11 };
    const cam = Object.assign({}, DEF);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function box(w, h, d, color, x, y, z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
      m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
    }
    function placeCam() {
      const c = Math.cos(cam.el);
      camera.position.set(T.x + cam.r * Math.sin(cam.az) * c, T.y + cam.r * Math.sin(cam.el), T.z + cam.r * Math.cos(cam.az) * c);
      camera.lookAt(T.x, T.y, T.z);
    }

    function build() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x14161c);
      camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
      clock = new THREE.Clock();

      // luzes
      const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x30261f, 1.6);
      const sun = new THREE.DirectionalLight(0xffffff, 3);
      sun.position.set(4, 8, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 25 });
      sun.shadow.camera.updateProjectionMatrix();
      const lamp = new THREE.PointLight(0xffd9a0, 0, 0, 2);
      lamp.position.set(0, 3.6, 0);
      scene.add(hemi, sun, lamp);

      // piso e paredes
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 8), new THREE.MeshStandardMaterial({ color: 0x4a382b, roughness: 0.95 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      const wall = c => new THREE.MeshStandardMaterial({ color: c, roughness: 1 });
      const back = new THREE.Mesh(new THREE.PlaneGeometry(12, 4), wall(0x2a3042));
      back.position.set(0, 2, -4); back.receiveShadow = true; scene.add(back);
      const left = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), wall(0x232838));
      left.rotation.y = Math.PI / 2; left.position.set(-6, 2, 0); left.receiveShadow = true; scene.add(left);
      box(12, 0.18, 0.1, 0x14161c, 0, 0.09, -3.95);
      box(0.1, 0.18, 8, 0x14161c, -5.95, 0.09, 0);

      // janela com ceu, sol/lua e estrelas
      const win = { x: -3, y: 2.2, z: -3.98, w: 2.4, h: 1.5 };
      const sky = new THREE.Mesh(new THREE.PlaneGeometry(win.w, win.h), new THREE.MeshBasicMaterial({ color: 0x6cb6ff }));
      sky.position.set(win.x, win.y, win.z); scene.add(sky);
      const disc = new THREE.Mesh(new THREE.CircleGeometry(0.2, 24), new THREE.MeshBasicMaterial({ color: 0xffd54a }));
      disc.position.set(win.x + 0.5, win.y + 0.2, win.z + 0.01); scene.add(disc);
      const pts = [[-0.9, 0.5], [0.8, 0.55], [0.2, 0.3], [-0.4, -0.2], [1, -0.3], [-1, 0.1]].flatMap(([a, b]) => [win.x + a, win.y + b, win.z + 0.01]);
      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 }));
      stars.visible = false; scene.add(stars);
      const fc = 0x14161c, t = 0.1;
      box(win.w + 2 * t, t, 0.12, fc, win.x, win.y + win.h / 2 + t / 2, -3.97);
      box(win.w + 2 * t, t, 0.12, fc, win.x, win.y - win.h / 2 - t / 2, -3.97);
      box(t, win.h, 0.12, fc, win.x - win.w / 2 - t / 2, win.y, -3.97);
      box(t, win.h, 0.12, fc, win.x + win.w / 2 + t / 2, win.y, -3.97);
      box(0.05, win.h, 0.1, fc, win.x, win.y, -3.97);
      box(win.w, 0.05, 0.1, fc, win.x, win.y, -3.97);

      // dia/noite pela hora real (o relogio da pagina grava body[data-tod])
      let last = '';
      O3.applyTod = () => {
        const n = document.body.dataset.tod === 'night';
        const k = n ? 'n' : 'd';
        if (k === last) return;
        last = k;
        sky.material.color.set(n ? 0x10163a : 0x6cb6ff);
        disc.material.color.set(n ? 0xe8e8ee : 0xffd54a);
        stars.visible = n;
        hemi.intensity = n ? 0.6 : 1.6;
        sun.intensity = n ? 0.6 : 3;
        sun.color.set(n ? 0x8fa8ff : 0xffffff);
        lamp.intensity = n ? 35 : 0;
      };

            // ===== mesas, monitores e cadeiras (passo 3.1) =====
      const SEAT_Z = -1.65;
      const mkDesk = (x, accent, idx) => {
        const z = -2.7;
        box(2.2, 0.08, 1.1, 0x6b4a2f, x, 0.76, z);                       // tampo
        for (const dx of [-1, 1]) for (const dz of [-0.45, 0.45])
          box(0.08, 0.72, 0.08, 0x4e3521, x + dx, 0.36, z + dz);          // pes
        box(2.2, 0.03, 0.02, accent, x, 0.7, z + 0.56);                   // faixa da cor do agente
        box(0.14, 0.22, 0.1, 0x20232c, x, 0.91, z - 0.2);                 // pe do monitor
        box(1.0, 0.6, 0.06, 0x14161c, x, 1.3, z - 0.25);                  // moldura
        const glow = box(0.9, 0.5, 0.01, 0x0b0d12, x, 1.3, z - 0.215);   // tela
        glow.material.emissive.set(accent); glow.material.emissiveIntensity = 0.8;
        box(0.6, 0.03, 0.2, 0x20232c, x, 0.82, z + 0.2);                  // teclado
        box(0.1, 0.03, 0.14, 0x20232c, x + 0.5, 0.82, z + 0.22);          // mouse
        box(0.7, 0.08, 0.7, 0x2b2f3d, x, 0.5, SEAT_Z);                    // assento
        box(0.7, 0.7, 0.08, 0x2b2f3d, x, 0.9, SEAT_Z + 0.35);             // encosto
        box(0.08, 0.46, 0.08, 0x1a1c24, x, 0.23, SEAT_Z);                 // haste
        O3.tickers.push((dt, t) => { glow.material.emissiveIntensity = 0.8 + 0.1 * Math.sin(t * 2 + idx); });
        return { x, seatZ: SEAT_Z, deskZ: z, glow };
      };
      O3.desks = {
        plan:  mkDesk(-1.4, 0xf2c94c, 0),   // auditor (amarelo)
        build: mkDesk( 2.2, 0x4a90e2, 1),   // construtor (azul)
      };

            // ===== decoracao da sala (passo 5.2): quadro, estante, cafe e planta =====
      // quadro na parede do fundo
      box(1.5, 1.0, 0.04, 0x14161c, 0.4, 2.65, -3.96);                  // moldura
      box(1.38, 0.88, 0.02, 0x2d4a7a, 0.4, 2.65, -3.94);                // fundo da arte
      box(0.5, 0.5, 0.02, 0xf2c94c, 0.15, 2.8, -3.925);                 // sol
      box(1.38, 0.3, 0.02, 0x3fa65a, 0.4, 2.36, -3.925);                // colina

      // estante na parede da esquerda
      const SX = -5.78, WOOD = 0x4e3521;
      box(0.4, 2.2, 0.06, WOOD, SX, 1.1, -1.8);
      box(0.4, 2.2, 0.06, WOOD, SX, 1.1, -0.2);
      box(0.04, 2.2, 1.6, WOOD, -5.97, 1.1, -1.0);
      const BOOKS = [0xeb5757, 0x4a90e2, 0xf2c94c, 0x3fa65a, 0xcfd6e4, 0xd9822b];
      [0.05, 0.6, 1.15, 1.7, 2.18].forEach((y, row) => {
        box(0.4, 0.05, 1.6, WOOD, SX, y, -1.0);                          // prateleira
        if (row === 4) return;
        for (let i = 0; i < 12; i++) {
          const h = 0.28 + ((i * 7 + row * 3) % 4) * 0.05;
          box(0.26, h, 0.09, BOOKS[(i + row * 2) % BOOKS.length], SX, y + 0.025 + h / 2, -1.72 + i * 0.125);
        }
      });

      // bancada com maquina de cafe (canto esquerdo do fundo)
      box(1.0, 0.7, 0.7, 0x3a3f50, -5.1, 0.35, -3.6);
      box(1.06, 0.04, 0.76, 0x6b4a2f, -5.1, 0.72, -3.6);
      box(0.38, 0.5, 0.34, 0x20232c, -5.3, 0.99, -3.7);                  // maquina
      box(0.38, 0.08, 0.34, 0x14161c, -5.3, 1.28, -3.7);
      box(0.08, 0.1, 0.1, 0x8a93a8, -5.3, 0.98, -3.5);                   // bico
      box(0.1, 0.12, 0.1, 0xffffff, -5.3, 0.8, -3.5);                    // xicara
      box(0.1, 0.12, 0.1, 0xffffff, -4.8, 0.8, -3.5);
      const led = box(0.05, 0.05, 0.02, 0xeb5757, -5.2, 1.15, -3.52);
      led.material.emissive.set(0xeb5757);
      O3.tickers.push((dt, t) => { led.material.emissiveIntensity = 0.6 + 0.4 * Math.sin(t * 3); });

      // planta perto da porta
      const PX = 5.5, PZ = -3.3;
      box(0.42, 0.36, 0.42, 0x8b4a2b, PX, 0.18, PZ);                     // vaso
      box(0.36, 0.04, 0.36, 0x3b2a1c, PX, 0.37, PZ);                     // terra
      const leaves = [];
      for (let i = 0; i < 7; i++) {
        const lf = box(0.1, i === 6 ? 0.8 : 0.55, 0.04, i % 2 ? 0x3fa65a : 0x2f8a49, PX, 0.39, PZ);
        lf.geometry.translate(0, (i === 6 ? 0.8 : 0.55) / 2, 0);        // pivo na base da folha
        lf.rotation.order = 'YXZ';
        lf.rotation.y = i * Math.PI * 2 / 6;
        lf.userData.tilt = i === 6 ? 0 : 0.55;
        leaves.push(lf);
      }
      O3.tickers.push((dt, t) => { leaves.forEach((lf, i) => { lf.rotation.x = lf.userData.tilt + 0.05 * Math.sin(t * 1.2 + i); }); });

            // ===== agentes 3D (passo 3.2): leem o estado dos cartoes 2D =====
      const SKIN = 0xf2c9a0;
      const part = (parent, w, h, d, color, x, y, z) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
        m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m;
      };
      const STATE_COL = { idle: '#8a8fa0', waiting: '#f2994a', error: '#eb5757', done: '#27ae60' };
      const SCREEN = { idle: 0x333a4d, waiting: 0xf2994a, error: 0xeb5757, done: 0x27ae60 };
      const ICON = { idle: 'Zzz ', waiting: '\u270B ', error: '\u26A0 ', done: '\u2714 ' };

      const mkAgent = (who, desk, color, hex) => {
        const g = new THREE.Group();
        g.position.set(desk.x, 0, desk.seatZ + 0.05);
        scene.add(g);
        // pernas (sentado)
        for (const sx of [-1, 1]) {
          part(g, 0.16, 0.14, 0.55, 0x20232c, sx * 0.14, 0.62, -0.25);
          part(g, 0.14, 0.5, 0.14, 0x20232c, sx * 0.14, 0.32, -0.5);
        }
        const body = new THREE.Group(); g.add(body);
        part(body, 0.5, 0.6, 0.3, color, 0, 0.88, 0);
        const head = new THREE.Group(); head.position.set(0, 1.18, 0); body.add(head);
        part(head, 0.34, 0.34, 0.32, SKIN, 0, 0.2, 0);
        part(head, 0.38, 0.12, 0.36, 0x2b2f3d, 0, 0.4, 0.01);
        const eyes = [-0.08, 0.08].map(ex => part(head, 0.06, 0.08, 0.02, 0x14161c, ex, 0.22, -0.17));
        const mouth = part(head, 0.1, 0.03, 0.02, 0x14161c, 0, 0.1, -0.17);
        const mkArm = sx => {
          const p = new THREE.Group(); p.position.set(sx * 0.32, 1.12, 0); body.add(p);
          part(p, 0.12, 0.12, 0.6, color, 0, 0, -0.3);
          part(p, 0.1, 0.1, 0.1, SKIN, 0, 0, -0.62);
          return p;
        };
        const armL = mkArm(-1), armR = mkArm(1);

        // balao de texto (sprite com canvas)
        const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
        const ctx = cv.getContext('2d');
        const tex = new THREE.CanvasTexture(cv);
        const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
        spr.scale.set(2.4, 0.6, 1); spr.position.set(0, 2.25, 0); spr.renderOrder = 10; g.add(spr);
        let key = '';
        const drawBubble = (st, text) => {
          const col = STATE_COL[st] || ('#' + hex.toString(16).padStart(6, '0'));
          ctx.clearRect(0, 0, 512, 128);
          ctx.fillStyle = 'rgba(20,22,28,0.88)'; ctx.strokeStyle = col; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.roundRect(6, 6, 500, 116, 28); ctx.fill(); ctx.stroke();
          ctx.fillStyle = col; ctx.font = 'bold 40px system-ui, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          let s = (ICON[st] || '') + text;
          if (s.length > 28) s = s.slice(0, 27) + '\u2026';
          ctx.fillText(s, 256, 66);
          tex.needsUpdate = true;
        };

        // ferramentas (passo 5.3)
const props = new THREE.Group(); props.position.set(0.8, 0.95, -1.0); g.add(props);
const mkP = fn => { const p = new THREE.Group(); p.visible = false; props.add(p); fn(p); return p; };
const P = {
  bash: mkP(p => { part(p, 0.5, 0.32, 0.04, 0x0b0d12, 0, 0.16, 0).material.emissive.set(0x1f7a4f); }),
  search: mkP(p => { part(p, 0.22, 0.22, 0.03, 0x9ad1ff, 0, 0.3, 0); part(p, 0.04, 0.2, 0.04, 0x6b4a2f, 0, 0.1, 0); }),
  read: mkP(p => { part(p, 0.3, 0.04, 0.22, 0xeb5757, 0, 0.05, 0); part(p, 0.27, 0.03, 0.2, 0xffffff, 0, 0.09, 0); }),
  web: mkP(p => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshStandardMaterial({ color: 0x4a90e2, roughness: 0.6 })); m.position.y = 0.25; p.add(m); }),
};

        let card = null, bub = null;
        O3.tickers.push((dt, t) => {
          if (!card || !card.isConnected) {
            card = document.querySelector('.agent[data-who="' + who + '"]');
            bub = card && card.querySelector('.bt');
          }
          const st = (card && card.dataset.status) || 'idle';
          const text = bub ? bub.textContent.trim() : '';
          if (st + '|' + text !== key) { key = st + '|' + text; drawBubble(st, text); }

          // pose base
          let aL = -1.4, aR = -1.4, by = 0, hx = 0, hy = 0, eyeS = 1, mx = 1;
          if (st === 'working') {
            aL = -0.5 + 0.12 * Math.sin(t * 14);
            aR = -0.5 + 0.12 * Math.sin(t * 14 + 2);
            by = 0.015 * Math.sin(t * 2.6);
            hx = 0.1;
          } else if (st === 'waiting') {
            aR = 1.5 + 0.4 * Math.sin(t * 10);
          } else if (st === 'done') {
            aL = 1.5 + 0.4 * Math.sin(t * 12);
            aR = 1.5 + 0.4 * Math.sin(t * 12 + 1);
            by = Math.abs(Math.sin(t * 6)) * 0.12;
            mx = 1.8;
          } else if (st === 'error') {
            hy = Math.sin(t * 40) * 0.25;
          } else { // idle: dormindo
            hx = 0.45; eyeS = 0.15; by = 0.01 * Math.sin(t * 1.5);
          }
          armL.rotation.x = aL; armR.rotation.x = aR;
          body.position.y = by;
          head.rotation.x = hx; head.rotation.y = hy;
          for (const e of eyes) e.scale.y = eyeS;
          mouth.scale.x = mx;
          desk.glow.material.emissive.set(st === 'working' ? hex : (SCREEN[st] || hex));
          const kind = (card && card.dataset.kind) || 'think';
          for (const k in P) P[k].visible = (st === 'working' && k === kind);
          P.web.rotation.y = t * 2;
          P.search.rotation.z = 0.3 * Math.sin(t * 3);
        });
        return { group: g, head, body, armL, armR };
      };
      O3.agents = {
        plan:  mkAgent('plan',  O3.desks.plan,  0xf2c94c, 0xf2c94c),
        build: mkAgent('build', O3.desks.build, 0x4a90e2, 0x4a90e2),
      };

            // ===== subagentes 3D (passo 4) =====
      // porta no fundo, a direita
      box(1.1, 2.3, 0.06, 0x1d212b, 4.8, 1.15, -3.97);
      box(1.3, 0.1, 0.1, 0x14161c, 4.8, 2.35, -3.95);
      box(0.1, 2.4, 0.1, 0x14161c, 4.2, 1.2, -3.95);
      box(0.1, 2.4, 0.1, 0x14161c, 5.4, 1.2, -3.95);

      // mesinhas dos subagentes (5 vagas)
      const SLOTS = [-4.2, -2.5, -0.8, 0.9, 2.6].map(x => {
        box(1.1, 0.06, 0.6, 0x5a4a3a, x, 0.62, 1.2);
        for (const dx of [-0.5, 0.5]) for (const dz of [-0.24, 0.24]) box(0.06, 0.6, 0.06, 0x3d2f22, x + dx, 0.3, 1.2 + dz);
        box(0.5, 0.02, 0.34, 0x20232c, x, 0.66, 1.3);                 // base do notebook
        const scr = box(0.5, 0.32, 0.02, 0x0b0d12, x, 0.83, 1.12);    // tela
        scr.rotation.x = -0.15;
        scr.material.emissive.set(0x3ddc97); scr.material.emissiveIntensity = 0.15;
        return { x, used: false, scr };
      });

      const BOT = 0xcfd6e4, BACC = 0x3ddc97, BDOOR = { x: 4.8, z: -3.5 };
      const BCOL = { working: '#3ddc97', done: '#27ae60' };
      let subsFake = null;
      O3.setSubs = arr => { subsFake = arr || []; };   // para testar no Console

      const bots = new Map();
      const botSay = s => '\u21B3 ' + (s.text || s.task || s.name || 'subagente');

      const mkBot = (sub, slot) => {
        slot.used = true;
        const g = new THREE.Group(); g.position.set(BDOOR.x, 0, -3.7); g.scale.setScalar(0.001); scene.add(g);
        const legs = [-1, 1].map(sx => {
          const p = new THREE.Group(); p.position.set(sx * 0.1, 0.38, 0); g.add(p);
          part(p, 0.1, 0.38, 0.12, 0x8a93a8, 0, -0.19, 0); return p;
        });
        const body = new THREE.Group(); g.add(body);
        part(body, 0.34, 0.36, 0.22, BOT, 0, 0.58, 0);
        part(body, 0.12, 0.08, 0.02, BACC, 0, 0.6, -0.12).material.emissive.set(BACC);
        const head = new THREE.Group(); head.position.set(0, 0.88, 0); body.add(head);
        part(head, 0.3, 0.24, 0.26, BOT, 0, 0.12, 0);
        for (const ex of [-0.07, 0.07]) part(head, 0.07, 0.07, 0.02, BACC, ex, 0.14, -0.14).material.emissive.set(BACC);
        part(head, 0.02, 0.12, 0.02, 0x8a93a8, 0, 0.3, 0);
        part(head, 0.06, 0.06, 0.06, BACC, 0, 0.38, 0).material.emissive.set(BACC);
        const mkA = sx => {
          const p = new THREE.Group(); p.position.set(sx * 0.22, 0.7, 0); body.add(p);
          part(p, 0.07, 0.07, 0.34, BOT, 0, 0, -0.17); return p;
        };
        const armL = mkA(-1), armR = mkA(1);
        const paper = part(g, 0.22, 0.02, 0.28, 0xffffff, 0, 0.6, -0.32); paper.visible = false;

        // balao
        const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
        const cx = cv.getContext('2d'), tex = new THREE.CanvasTexture(cv);
        const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
        spr.scale.set(1.9, 0.475, 1); spr.position.set(0, 1.55, 0); spr.renderOrder = 10; g.add(spr);
        let key = '';
        const say = (st, text) => {
          if (st + text === key) return; key = st + text;
          const col = BCOL[st] || BACC;
          cx.clearRect(0, 0, 512, 128);
          cx.fillStyle = 'rgba(20,22,28,0.88)'; cx.strokeStyle = col; cx.lineWidth = 6;
          cx.beginPath(); cx.roundRect(6, 6, 500, 116, 28); cx.fill(); cx.stroke();
          cx.fillStyle = col; cx.font = 'bold 40px system-ui, sans-serif';
          cx.textAlign = 'center'; cx.textBaseline = 'middle';
          let s = (st === 'done' ? '\u2714 ' : '') + text;
          if (s.length > 28) s = s.slice(0, 27) + '\u2026';
          cx.fillText(s, 256, 66); tex.needsUpdate = true;
        };

        const b = { id: sub.id, g, slot, phase: 'in', path: [], age: 0, wait: 0, desk: null, legs, body, head, armL, armR, paper, say, moving: false };
        b.path = [{ x: BDOOR.x, z: BDOOR.z }, { x: BDOOR.x, z: 2.5 }, { x: slot.x, z: 2.5 }, { x: slot.x, z: 1.9 }];
        return b;
      };

      // cada robo cria geometrias, materiais e a textura do balao: libera tudo da GPU quando ele sai
      // (a geometria do Sprite e compartilhada pelo three.js, nao pode ser descartada)
      const freeBot = g => g.traverse(o => {
        if (o.geometry && !o.isSprite) o.geometry.dispose();
        if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
      });

      const turnTo = (b, ang, dt) => {
        let d = ang - b.g.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
        b.g.rotation.y += d * Math.min(1, dt * 10);
      };
      // anda ate o proximo ponto; devolve true quando o caminho acabou
      const botWalk = (b, dt) => {
        const p = b.path[0]; b.moving = false;
        if (!p) return true;
        const dx = p.x - b.g.position.x, dz = p.z - b.g.position.z, d = Math.hypot(dx, dz), step = 2.2 * dt;
        if (d <= step) { b.g.position.x = p.x; b.g.position.z = p.z; b.path.shift(); return b.path.length === 0; }
        b.g.position.x += dx / d * step; b.g.position.z += dz / d * step;
        turnTo(b, Math.atan2(dx, dz) + Math.PI, dt);
        b.moving = true; return false;
      };

      O3.tickers.push((dt, t) => {
        const subsData = subsFake || O3.subs;
        // 1) cria robos para subagentes novos (se houver vaga)
        for (const s of subsData) {
          if (s.status === 'done' || bots.has(s.id)) continue;
          const sl = SLOTS.find(x => !x.used); if (!sl) break;
          bots.set(s.id, mkBot(s, sl));
        }
        const live = new Map(subsData.map(s => [s.id, s]));
        // 2) atualiza cada robo
        for (const [id, b] of bots) {
          const s = live.get(id);
          b.age += dt;
          if (b.phase !== 'gone') b.g.scale.setScalar(Math.min(1, b.age / 0.3));
          let aL = -1.2, aR = -1.2, hx = 0;

          if (b.phase === 'in') {
            b.say('working', s ? botSay(s) : '\u21B3 ...');
            if (botWalk(b, dt)) { b.phase = 'work'; }
          } else if (b.phase === 'work') {
            turnTo(b, 0, dt);
            b.say('working', s ? botSay(s) : '\u21B3 ...');
            aL = -0.5 + 0.15 * Math.sin(t * 14); aR = -0.5 + 0.15 * Math.sin(t * 14 + 2);
            hx = 0.15; b.slot.scr.material.emissiveIntensity = 0.7;
            if (!s || s.status === 'done') {            // terminou: pega o papel e vai entregar
              b.slot.used = false; b.slot.scr.material.emissiveIntensity = 0.15;
              const who = (document.querySelector('.agent[data-who="build"]') || {}).dataset?.status === 'working' ? 'build' : 'plan';
              b.desk = O3.desks[who]; b.paper.visible = true; b.phase = 'deliver';
              const dx = b.desk.x + 1.5;
              b.path = [{ x: b.slot.x, z: 2.5 }, { x: dx, z: 2.5 }, { x: dx, z: -1.6 }];
            }
          } else if (b.phase === 'deliver') {
            b.say('done', 'entregando');
            aL = aR = -0.2;
            if (botWalk(b, dt)) { b.phase = 'hand'; b.wait = 0.9; }
          } else if (b.phase === 'hand') {
            turnTo(b, Math.PI / 2, dt);                  // olha para a mesa do agente
            aL = aR = -0.1 + 0.1 * Math.sin(t * 8);
            b.wait -= dt;
            if (b.wait <= 0) {
              b.paper.visible = false; b.phase = 'out';
              const dx = b.desk.x + 1.5;
              b.path = [{ x: dx, z: -0.5 }, { x: BDOOR.x, z: -0.5 }, { x: BDOOR.x, z: BDOOR.z }, { x: BDOOR.x, z: -3.75 }];
            }
          } else if (b.phase === 'out') {
            b.say('done', 'ok!');
            if (botWalk(b, dt)) { b.phase = 'gone'; b.age = 0; }
          } else if (b.phase === 'gone') {
            const k = Math.max(0, 1 - b.age / 0.3);
            b.g.scale.setScalar(Math.max(0.001, k));
            if (k <= 0) { scene.remove(b.g); freeBot(b.g); bots.delete(id); continue; }
          }

          // animacao de caminhada
          if (b.moving) {
            b.legs[0].rotation.x = Math.sin(t * 12) * 0.6; b.legs[1].rotation.x = -Math.sin(t * 12) * 0.6;
            aL = -1.2 + Math.sin(t * 12) * 0.5; aR = -1.2 - Math.sin(t * 12) * 0.5;
            b.body.position.y = Math.abs(Math.sin(t * 12)) * 0.02;
          } else { b.legs[0].rotation.x = b.legs[1].rotation.x = 0; b.body.position.y = 0; }
          b.armL.rotation.x = aL; b.armR.rotation.x = aR; b.head.rotation.x = hx;
        }
      });

            // ===== camera acompanha o agente ativo (passo 5.1) =====
      O3.follow = true;
      const FOCUS = { plan: -1.4, build: 2.2 };
      const tgt = { x: 0, y: 1.1 };
      let userMoved = 0;
      host.addEventListener('pointerdown', () => { userMoved = performance.now(); });
      O3.tickers.push((dt) => {
        if (!O3.follow || performance.now() - userMoved < 8000) return;   // se voce mexeu na camera, espera 8s
        const st = who => (document.querySelector('.agent[data-who="' + who + '"]') || {}).dataset?.status;
        const active = ['build', 'plan'].find(w => ['working', 'waiting', 'error', 'done'].includes(st(w)));
        const tx = active ? FOCUS[active] * 0.5 : 0;
        const tr = active ? 8 : DEF.r;
        const k = Math.min(1, dt * 2);
        T.x += (tx - T.x) * k;
        cam.r += (tr - cam.r) * k;
        placeCam();
      });

      placeCam();
      Object.assign(O3, { THREE, scene, camera, renderer, box, placeCam, ready: true });
    }

    function init() {
      if (renderer) return true;
      if (failed) return false;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
      } catch (e) {
        failed = true;
        host.textContent = 'WebGL indisponível neste navegador.';
        host.style.color = '#8a8fa0'; host.style.padding = '12px';
        return false;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      host.style.position = 'relative';
      renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
      host.appendChild(renderer.domElement);
      build();

      // camera: arrastar gira, roda do mouse aproxima, duplo clique volta ao padrao
      let drag = null;
      host.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; try { host.setPointerCapture(e.pointerId); } catch {} });
      host.addEventListener('pointermove', e => {
        if (!drag) return;
        cam.az = clamp(cam.az - (e.clientX - drag.x) * 0.006, -0.35, 1.1);
        cam.el = clamp(cam.el + (e.clientY - drag.y) * 0.004, 0.12, 1.0);
        drag = { x: e.clientX, y: e.clientY };
        placeCam();
      });
      const end = () => { drag = null; };
      host.addEventListener('pointerup', end);
      host.addEventListener('pointercancel', end);
      host.addEventListener('wheel', e => { e.preventDefault(); cam.r = clamp(cam.r * (1 + Math.sign(e.deltaY) * 0.08), 6, 16); placeCam(); }, { passive: false });
      host.addEventListener('dblclick', () => { Object.assign(cam, DEF); placeCam(); });
      return true;
    }

    function resize() {
      if (!renderer) return;
      const w = host.clientWidth, h = host.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function loop() {
      if (!document.body.classList.contains('v3d') || document.hidden) { running = false; return; }
      requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
      O3.applyTod();
      for (const f of O3.tickers) f(dt, t);
      renderer.render(scene, camera);
    }
    function start() {
      if (running || document.hidden || !document.body.classList.contains('v3d')) return;
      if (!init()) return;
      resize();
      running = true;
      clock.getDelta();
      loop();
    }

    new ResizeObserver(resize).observe(host);
    new MutationObserver(start).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    document.addEventListener('visibilitychange', start);
    start();
  })();
</script>

    <div class="bar" id="ctxBar"><i id="ctxFill"></i></div>
  </div>
  <div class="chips">
    <span class="chip">&#9201; <b id="cTime">00:00</b></span>
    <span class="chip">&#128221; <b id="cFiles">0</b> arquivos</span>
    <span class="chip">&#129302; <b id="cSub">0</b> subagentes</span>
    <span class="chip">&#128176; <b id="cCost">$0.00</b></span>
    <span class="chip" id="cModelWrap" style="display:none">&#129504; <b id="cModel"></b></span>
  </div>
  <div class="box"><ul id="log"></ul></div>
</section>

<script>
  /* ============ personagens (SVG gerado por codigo) ============ */
  const CHARS = {
    plan:  { name:"Auditor",    sub:"Plan",  label:"Agente Plan, o auditor",    shirt:"#d9822b", arm2:"#b96d1f", look:"glasses" },
    build: { name:"Construtor", sub:"Build", label:"Agente Build, o construtor", shirt:"#3b82d6", arm2:"#2f6fba", look:"helmet" },
  };
  function charSVG(o){
    const eyes = o.look === "glasses" ? [56,68] : [57,67];
    const top = o.look === "glasses"
      ? '<path d="M47 64 Q62 46 77 64 Q62 56 47 64Z" fill="#2a2118"/><circle cx="56" cy="69" r="5" class="glass"/><circle cx="68" cy="69" r="5" class="glass"/><path d="M61 69h2" class="glass"/>'
      : '<path d="M45 62 Q62 40 79 62Z" fill="#5aa9ff"/><rect x="43" y="60" width="38" height="5" rx="2.5" fill="#3b82d6"/><rect x="59" y="46" width="6" height="14" rx="2" fill="#3b82d6"/>';
    return `<svg viewBox="0 0 200 170" role="img" aria-label="${o.label}">
      <rect x="0" y="130" width="200" height="40" fill="#14161c"/>
      <!-- parede: janela (dia/noite) e relogio -->
      <rect x="12" y="10" width="36" height="30" rx="3" fill="#0d0f14" stroke="#2b2f3a" stroke-width="2"/>
      <rect class="sky" x="15" y="13" width="30" height="24" rx="1.5"/>
      <circle class="sun" cx="30" cy="25" r="5"/>
      <g class="stars"><circle cx="21" cy="19" r=".9"/><circle cx="38" cy="17" r=".9"/><circle cx="40" cy="31" r=".9"/><circle cx="20" cy="32" r=".9"/></g>
      <path d="M30 13v24M15 25h30" stroke="#2b2f3a" stroke-width="1.5"/>
      <circle cx="172" cy="26" r="13" fill="#0d0f14" stroke="#2b2f3a" stroke-width="2"/>
      <line class="hh" x1="172" y1="26" x2="172" y2="19" stroke="#e8e8ee" stroke-width="2" stroke-linecap="round"/>
      <line class="mh" x1="172" y1="26" x2="172" y2="16" stroke="#8a8fa0" stroke-width="1.5" stroke-linecap="round"/>
      <!-- monitor -->
      <rect class="screen" x="112" y="56" width="70" height="48" rx="4"/>
      <g class="code">
        <rect class="ln" x="120" y="64" width="40" height="4" rx="2"/><rect class="ln" x="126" y="73" width="48" height="4" rx="2"/>
        <rect class="ln" x="126" y="82" width="32" height="4" rx="2"/><rect class="ln" x="120" y="91" width="44" height="4" rx="2"/>
        <rect class="ln" x="120" y="99" width="24" height="3" rx="1.5"/>
      </g>
      <g class="term">
        <text x="118" y="70" fill="#4ade80" font-size="9" font-family="monospace">$ build</text>
        <rect class="tl" x="118" y="75" width="44" height="3" rx="1.5"/><rect class="tl" x="118" y="82" width="56" height="3" rx="1.5"/>
        <rect class="tl" x="118" y="89" width="36" height="3" rx="1.5"/><rect class="cur" x="118" y="96" width="6" height="5"/>
      </g>
      <g class="bsod"><rect x="114" y="58" width="66" height="44" rx="3" fill="#3a1216"/>
        <text x="147" y="90" text-anchor="middle" font-size="30" font-weight="800" fill="#f87171">!</text></g>
      <rect x="143" y="104" width="8" height="12" fill="#2b2f3a"/><rect x="132" y="114" width="30" height="4" rx="2" fill="#2b2f3a"/>
      <g class="smoke"><circle cx="140" cy="54" r="4"/><circle cx="150" cy="52" r="4"/><circle cx="160" cy="54" r="4"/></g>
      <!-- pessoa -->
      <g class="body">
        <rect x="42" y="86" width="40" height="46" rx="10" fill="${o.shirt}"/>
        <g class="head">
          <circle cx="62" cy="68" r="15" fill="var(--skin)"/>
          <circle class="eye" cx="${eyes[0]}" cy="69" r="1.8" fill="#2a2118"/><circle class="eye" cx="${eyes[1]}" cy="69" r="1.8" fill="#2a2118"/>
          ${top}
          <path class="mouth m-n" d="M58 77h8" stroke="#8a5a3c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <path class="mouth m-h" d="M56 75Q62 82 68 75" stroke="#8a5a3c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <ellipse class="mouth m-o" cx="62" cy="78" rx="2.4" ry="3.2" fill="#7a3b2e"/>
          <path class="sweat" d="M80 58q3 5 0 8q-3-3 0-8z" fill="#7cc4ff"/>
        </g>
        <g transform="rotate(-30 80 94)"><rect class="arm armL" x="76" y="94" width="8" height="30" rx="4" fill="${o.shirt}"/></g>
        <g transform="rotate(-38 90 96)"><rect class="arm armR" x="86" y="96" width="8" height="28" rx="4" fill="${o.arm2}"/></g>
        <g class="up r" transform="rotate(200 80 94)"><rect class="upr" x="76" y="94" width="8" height="30" rx="4" fill="${o.shirt}"/></g>
        <g class="up" transform="rotate(-200 44 94)"><rect class="upr" x="40" y="94" width="8" height="30" rx="4" fill="${o.arm2}"/></g>
      </g>
      <!-- mesa -->
      <rect x="10" y="118" width="180" height="10" rx="3" fill="var(--desk)"/>
      <rect x="18" y="128" width="8" height="38" fill="var(--desk2)"/><rect x="174" y="128" width="8" height="38" fill="var(--desk2)"/>
      <rect x="82" y="114" width="26" height="4" rx="2" fill="#2b2f3a"/>
      <!-- cafe e planta -->
      <rect x="22" y="106" width="12" height="12" rx="2" fill="#e8e8ee"/><path d="M34 109h3a3 3 0 010 6h-3" fill="none" stroke="#e8e8ee" stroke-width="2"/>
      <g class="steam"><path d="M26 103q-2-4 0-7"/><path d="M31 103q-2-4 0-7"/></g>
      <rect x="184" y="108" width="10" height="10" rx="1.5" fill="#8b4a2b"/>
      <path d="M189 108q-8-6-6-14q6 4 6 14zM189 108q8-6 6-14q-6 4-6 14z" fill="#3fa65a"/>
      <!-- ferramentas -->
      <g class="prop p-search"><g class="swing"><circle cx="100" cy="86" r="7" fill="#0d0f14" fill-opacity=".5" stroke="#e8e8ee" stroke-width="2.4"/><line x1="105" y1="91" x2="112" y2="100" stroke="#e8e8ee" stroke-width="3" stroke-linecap="round"/></g></g>
      <g class="prop p-read"><path d="M86 112L98 108L110 112V98L98 94L86 98Z" fill="#e8e8ee"/><path class="page" d="M98 108V94L110 98V112Z" fill="#cfd3dd" stroke="#8a8fa0" stroke-width=".8"/></g>
      <g class="prop p-web"><circle cx="100" cy="88" r="9" fill="#1d4f91" stroke="#9fd0ff" stroke-width="1.5"/><ellipse class="mer" cx="100" cy="88" rx="4" ry="9" fill="none" stroke="#9fd0ff"/><path d="M91 88h18" stroke="#9fd0ff"/></g>
      <g class="think"><circle cx="86" cy="42" r="2.2"/><circle cx="93" cy="38" r="2.6"/><circle cx="101" cy="33" r="3"/></g>
      <g class="badge"><circle cx="100" cy="48" r="10" fill="#fbbf24"/><text x="100" y="54" text-anchor="middle" font-size="15" font-weight="800" fill="#14161c">!</text></g>
      <text class="zzz" x="82" y="48">z</text><text class="zzz" x="94" y="38">Z</text>
    </svg>`;
  }

  const office = document.getElementById('office');
  const cards = {}, bubbles = {};
  for (const who of ['plan','build']) {
    const o = CHARS[who];
    const sec = document.createElement('section');
    sec.className = 'agent'; sec.dataset.who = who; sec.dataset.status = 'idle'; sec.dataset.kind = 'think';
    sec.innerHTML = `<div class="bubble"><span class="bt">descansando…</span></div>${charSVG(o)}<div class="label">${o.name} <small>· ${o.sub}</small></div><div class="confetti"></div>`;
    office.appendChild(sec);
    cards[who] = sec; bubbles[who] = sec.querySelector('.bt');
  }

  /* ============ relogio da parede e dia/noite ============ */
  function tick() {
    const d = new Date(), h = d.getHours(), m = d.getMinutes();
    document.body.dataset.tod = (h >= 6 && h < 18) ? 'day' : 'night';
    document.querySelectorAll('.hh').forEach(e => e.setAttribute('transform', `rotate(${((h % 12) + m / 60) * 30} 172 26)`));
    document.querySelectorAll('.mh').forEach(e => e.setAttribute('transform', `rotate(${m * 6} 172 26)`));
  }
  tick(); setInterval(tick, 15000);

  /* ============ som, avisos e confete ============ */
  let audio = null, notifyOn = false;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  function beep(seq) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      let t = audio.currentTime;
      for (const [f, d] of seq) {
        const osc = audio.createOscillator(), g = audio.createGain();
        osc.frequency.value = f; osc.type = 'sine';
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        osc.connect(g).connect(audio.destination); osc.start(t); osc.stop(t + d + 0.02); t += d * 0.9;
      }
    } catch {}
  }
  const SOUNDS = { done: [[660,.12],[880,.12],[1320,.22]], waiting: [[880,.14],[880,.14],[880,.2]], error: [[330,.2],[220,.3]] };
  function notify(title, body) {
    try { if (notifyOn && 'Notification' in window && Notification.permission === 'granted' && !document.hasFocus()) new Notification(title, { body }); } catch {}
  }
  const bSound = document.getElementById('bSound');
  function setSound(on) { notifyOn = on; bSound.classList.toggle('on', on); store.set('office.sound', on ? '1' : '0'); }
  bSound.addEventListener('click', async () => {
    if (notifyOn) { setSound(false); return; }
    setSound(true);
    beep([[880,.08]]);
    try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch {}
  });
  if (store.get('office.sound', '0') === '1') { notifyOn = true; bSound.classList.add('on'); }
  document.addEventListener('click', () => { try { if (notifyOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }, { once: true });

  function confetti(card) {
    const box = card.querySelector('.confetti'); const colors = ['#ffb454','#5aa9ff','#4ade80','#f87171','#fbbf24','#e8e8ee'];
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('i');
      s.style.left = Math.random() * 100 + '%'; s.style.background = colors[i % colors.length];
      s.style.animationDelay = (Math.random() * 0.5) + 's'; s.style.transform = `rotate(${Math.random() * 180}deg)`;
      box.appendChild(s);
    }
    setTimeout(() => { box.textContent = ''; }, 3000);
  }

  /* ============ renderizacao ============ */
  const idle = 'descansando…';
  const fallback = { think: 'pensando…', read: 'lendo…', edit: 'escrevendo…', bash: 'rodando comando…', search: 'procurando…', web: 'pesquisando…', wait: 'preciso de você' };
  const prev = { plan: 'idle', build: 'idle' };
  const startedAt = { plan: 0, build: 0 };
  let lastDur = 0, cur = null, demo = false, connected = false;

  const $ = id => document.getElementById(id);
  const fmtK = n => n >= 100000 ? Math.round(n / 1000) + 'K' : n >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(n);
  const fmtT = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const ctxLimit = () => parseInt(store.get('office.ctx', '200000'), 10) || 200000;

  function apply(s) {
    cur = s;
    for (const who of ['plan','build']) {
      const a = s.agents[who], card = cards[who];
      card.dataset.status = a.status;
      card.dataset.kind = a.kind || 'think';
      const t = a.status === 'idle' ? idle : (a.text || (a.status === 'done' ? 'pronto!' : fallback[a.kind] || 'trabalhando…'));
      bubbles[who].textContent = t; bubbles[who].parentElement.title = t;
      const was = prev[who];
      if (was !== a.status) {
        if (a.status === 'working' && was !== 'waiting') startedAt[who] = Date.now();
        if ((was === 'working' || was === 'waiting') && a.status !== 'working') lastDur = Date.now() - (startedAt[who] || Date.now());
        if (a.status === 'done') { confetti(card); beep(SOUNDS.done); notify('Pronto!', CHARS[who].name + ' terminou o trabalho.'); }
        if (a.status === 'waiting') { beep(SOUNDS.waiting); notify('Preciso de você', a.text || 'O agente pediu permissão.'); }
        if (a.status === 'error') { beep(SOUNDS.error); notify('Deu erro', a.text || 'O agente encontrou um erro.'); }
        prev[who] = a.status;
      }
    }
    $('proj').textContent = s.project ? ' · ' + s.project : '';
    const used = s.ctxTokens || 0, lim = ctxLimit(), pct = Math.min(100, used / lim * 100);
    $('ctxTxt').textContent = `${fmtK(used)} / ${fmtK(lim)} (${Math.round(pct)}%)`;
    $('ctxFill').style.width = pct + '%';
    $('ctxBar').className = 'bar' + (pct >= 80 ? ' hot' : pct >= 60 ? ' mid' : '');
    $('cFiles').textContent = s.files || 0;
    $('cSub').textContent = s.subagents || 0;
    $('cCost').textContent = '$' + (s.cost || 0).toFixed(2);
    $('cModelWrap').style.display = s.model ? '' : 'none';
    $('cModel').textContent = String(s.model || '').split('/').pop();
    const ul = $('log'); ul.textContent = '';
    for (const e of (s.log || []).slice().reverse().slice(0, 5)) {
      const li = document.createElement('li');
      const tm = document.createElement('time'); tm.textContent = new Date(e.t).toTimeString().slice(0, 8);
      const dot = document.createElement('i'); dot.style.background = e.agent === 'plan' ? 'var(--plan)' : 'var(--build)';
      const sp = document.createElement('span'); sp.textContent = e.text; sp.title = e.text;
      li.append(tm, dot, sp); ul.appendChild(li);
    }
    updateTime();
  }
  function updateTime() {
    if (!cur) return;
    const w = ['plan','build'].map(k => cur.agents[k]).find(a => a.status === 'working' || a.status === 'waiting');
    const ref = w ? (startedAt[w === cur.agents.plan ? 'plan' : 'build'] || w.since) : 0;
    $('cTime').textContent = fmtT(w ? Date.now() - ref : lastDur);
  }
  setInterval(updateTime, 1000);

  $('ctx').addEventListener('click', () => {
    const v = prompt('Limite de contexto do modelo, em tokens (o Big Pickle usa cerca de 200000):', ctxLimit());
    if (v && parseInt(v, 10) > 1000) { store.set('office.ctx', String(parseInt(v, 10))); if (cur) apply(cur); }
  });
  const bCompact = $('bCompact');
  function setCompact(on) { document.body.classList.toggle('compact', on); store.set('office.compact', on ? '1' : '0'); }
  bCompact.addEventListener('click', () => setCompact(!document.body.classList.contains('compact')));
  if (store.get('office.compact', '0') === '1') document.body.classList.add('compact');

  /* ============ demo: mostra todos os estados ============ */
  const A = (status, text, kind) => ({ status, text, kind, since: Date.now() });
  const quiet = () => A('idle', '', 'think');
  function snap(plan, build, extra) {
    return Object.assign({ oc: true, project: 'demo', model: 'big-pickle', ctxTokens: 52000, cost: 0, files: 0, subagents: 0, log: [], agents: { plan, build } }, extra || {});
  }
  const DEMO = [
    snap(A('working','lendo server.js','read'), quiet(), { ctxTokens: 41000 }),
    snap(A('working','procurando empresaId','search'), quiet(), { ctxTokens: 56000, subagents: 1 }),
    snap(A('working','pensando…','think'), quiet(), { ctxTokens: 72000 }),
    snap(A('waiting','pedindo permissão: bash git status','wait'), quiet(), { ctxTokens: 80000 }),
    snap(A('error','Rate limit atingido (tente em 20s)','think'), quiet(), { ctxTokens: 130000 }),
    snap(A('done','pronto!','think'), quiet(), { ctxTokens: 150000, files: 0 }),
    snap(quiet(), A('working','editando LockOverlay.kt','edit'), { ctxTokens: 20000, files: 1 }),
    snap(quiet(), A('working','rodando gradlew assembleDebug','bash'), { ctxTokens: 33000, files: 2 }),
    snap(quiet(), A('working','pesquisando na web','web'), { ctxTokens: 36000, files: 2 }),
    snap(quiet(), A('done','pronto!','think'), { ctxTokens: 160000, files: 3 }),
    snap(quiet(), quiet(), { ctxTokens: 160000, files: 3 }),
  ];
  $('bDemo').addEventListener('click', () => {
    if (demo) return;
    demo = true; let i = 0;
    const step = () => {
      if (i >= DEMO.length) { demo = false; if (last) apply(last); else apply(snap(quiet(), quiet())); return; }
      const s = DEMO[i++];
      s.log = [{ t: Date.now(), agent: 'plan', text: 'demonstração ' + i + ' de ' + DEMO.length }];
      apply(s); setTimeout(step, 2600);
    };
    step();
  });

  /* ============ conexao com o servidor local ============ */
  const dot = $('dot'), conn = $('conn');
  let last = null;
  function status(sv) {
    if (!connected) { dot.className = 'dot'; conn.textContent = 'servidor desconectado'; return; }
    const on = [sv && sv.oc && 'opencode', sv && sv.cc && 'Claude Code'].filter(Boolean);
    if (on.length) { dot.className = 'dot on'; conn.textContent = 'conectado ao ' + on.join(' + '); }
    else { dot.className = 'dot wait'; conn.textContent = 'aguardando o opencode ou o Claude Code…'; }
  }
  if (location.protocol !== 'file:') {
    const es = new EventSource('/events');
    es.onopen = () => { connected = true; status(last); };
    es.onmessage = e => { try { last = JSON.parse(e.data); connected = true; status(last); window.O3.subs = last.subs || []; if (!demo) apply(last); } catch {} };
    es.onerror = () => { connected = false; status(last); };
  } else { conn.textContent = 'abra por http://localhost:4747'; }

  // clique em um personagem: alterna trabalhando/parado so na tela, durante o demo ou sem servidor
  // (nunca mexe no estado real: um clique sem querer trocava o agente ativo para todo mundo)
  for (const who of ['plan','build']) cards[who].addEventListener('click', () => {
    if (connected && !demo) return;
    const a = cur && cur.agents[who];
    const next = a && a.status === 'working' ? 'idle' : 'working';
    const s = cur ? { ...cur, agents: { ...cur.agents } } : snap(quiet(), quiet());
    s.agents[who] = next === 'idle' ? quiet() : A('working', 'teste manual', 'edit');
    apply(s);
  });
  apply(snap(quiet(), quiet(), { oc: false, project: '', model: '', ctxTokens: 0 }));
  window.__apply = apply; // usado nos testes
</script>
